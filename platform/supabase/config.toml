project_id = "ratio-soluciones-clientes"

[auth]
site_url = "https://clientes.ratiosoluciones.es"
enable_signup = false
additional_redirect_urls = [
  "https://crm.ratiosoluciones.es/**",
  "https://clientes.ratiosoluciones.es/**"
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8

[functions.invite-client]
verify_jwt = false

[functions.update-case]
verify_jwt = false

[functions.document-workflow]
verify_jwt = false

[functions.manage-crm]
verify_jwt = false

[functions.public-intake]
verify_jwt = false

[functions.ai-assist]
verify_jwt = false
