name: Publicar web pública en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'bancos.html'
      - 'deudas.html'
      - 'vivienda.html'
      - 'seguros.html'
      - 'familia.html'
      - 'no-puedo-pagar-mis-deudas.html'
      - 'tarjeta-deuda-no-baja.html'
      - 'legal.html'
      - 'aviso-legal.html'
      - 'gracias.html'
      - 'styles.css'
      - 'script.js'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'favicon.svg'
      - 'og-ratio-soluciones.svg'
      - 'og-ratio-soluciones.png'
      - 'CNAME'
      - 'build.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build static site
        run: node build.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
